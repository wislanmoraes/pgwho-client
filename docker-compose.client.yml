# ─────────────────────────────────────────────────────────────────────────────
#  pgwho — Template para implantação em parceiros
#
#  Uso:
#    1. Copie este arquivo para o servidor do parceiro
#    2. Crie um .env com as variáveis listadas abaixo
#    3. docker compose -f docker-compose.client.yml up -d
#
#  Pré-requisito: login no registry
#    echo $GHCR_TOKEN | docker login ghcr.io -u SEU_USUARIO --password-stdin
# ─────────────────────────────────────────────────────────────────────────────

name: pgwho

x-images: &registry ghcr.io/wislanmoraes

# Hardening comum reaproveitado por todo serviço abaixo (âncora YAML) —
# no-new-privileges bloqueia escalonamento via setuid/setcap mesmo que o
# processo dentro do container tente; log rotation evita que uma instalação
# "sobe e esquece" por meses encha o disco do parceiro com json-file sem limite.
x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:

  # ── Banco de dados (TimescaleDB) ──────────────────────────────────────────
  timescaledb:
    <<: *hardening
    # Pinada (era latest-pg18) — uma troca silenciosa de versão major/minor
    # do TimescaleDB num `docker compose pull` pode quebrar coisas que
    # dependem de versão exata (ex.: compressão nativa, Issue #55/#57).
    #
    # Achado ao vivo (cliente): a primeira tentativa de pin (2.27.2) já
    # nasceu quebrando quem tinha rodado :latest-pg18 antes desta linha
    # existir e avançado além dela (extensão registrada em 2.29.2 no
    # catálogo do banco) — CREATE EXTENSION IF NOT EXISTS nunca atualiza
    # uma extensão já instalada, e a imagem 2.27.2 não tem mais o .so de
    # releases mais novas. Resultado: backend trava no lifespan pra
    # SEMPRE (não é transitório) até a imagem ser trocada de volta pra uma
    # versão >= a já registrada. NUNCA reduza esta tag abaixo da mais alta
    # já publicada aqui — só suba. (main.py roda ALTER EXTENSION UPDATE no
    # boot, então subir a versão sempre migra os clientes pra frente
    # sozinho; descer nunca vai funcionar, e trava instalações existentes.)
    image: timescale/timescaledb:2.29.2-pg18
    container_name: pgwho_db
    # Issue #57/#61: pg_stat_statements + auto_explain (limiar 10ms) no banco
    # INTERNO — telemetria do próprio backend, além da que já existe pras
    # instâncias monitoradas. Ver docker-compose.dev.yml (repo privado) pro
    # comentário completo sobre a escolha do limiar de 10ms.
    # logging_collector=on + jsonlog: ver docker-compose.dev.yml (repo
    # privado) pro comentário completo — log estruturado (Logs Brutos, aba
    # Banco) em vez de texto livre quebrado em várias linhas.
    command: [
      "postgres",
      "-c", "shared_preload_libraries=timescaledb,pg_stat_statements,auto_explain",
      "-c", "pg_stat_statements.track=all",
      "-c", "auto_explain.log_min_duration=10ms",
      "-c", "auto_explain.log_analyze=off",
      "-c", "auto_explain.log_format=text",
      "-c", "logging_collector=on",
      "-c", "log_destination=stderr,jsonlog"
    ]
    environment:
      POSTGRES_USER:     ${DB_USER:-pgwho}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD obrigatório}
      POSTGRES_DB:       ${DB_NAME:-pgwho}
    volumes:
      - timescaledb_data:/var/lib/postgresql
    networks:
      - pgwho_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-pgwho} -d ${DB_NAME:-pgwho}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 5g
    # TimescaleDB nunca expõe porta para o host — acessível apenas internamente

  # ── Backend (FastAPI) ─────────────────────────────────────────────────────
  backend:
    <<: *hardening
    image: ghcr.io/wislanmoraes/pgwho-backend:${IMAGE_TAG:-latest}
    container_name: pgwho_backend
    user: root   # necessário para acessar /var/run/docker.sock (WatchShell)
    environment:
      DATABASE_URL:      postgresql+asyncpg://${DB_USER:-pgwho}:${DB_PASSWORD}@timescaledb:5432/${DB_NAME:-pgwho}
      DATABASE_URL_SYNC: postgresql://${DB_USER:-pgwho}:${DB_PASSWORD}@timescaledb:5432/${DB_NAME:-pgwho}
      SECRET_KEY:        ${SECRET_KEY:?SECRET_KEY obrigatório}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      COLLECTOR_INTERVAL_SECONDS:        ${COLLECTOR_INTERVAL_SECONDS:-60}
      ACTIVITY_SAMPLE_INTERVAL_SECONDS:  ${ACTIVITY_SAMPLE_INTERVAL_SECONDS:-5}
      ALERT_EVALUATION_INTERVAL_SECONDS: ${ALERT_EVALUATION_INTERVAL_SECONDS:-60}
      WATCHSHELL_IMAGE: ghcr.io/wislanmoraes/pgwho-watchshell:${IMAGE_TAG:-latest}
      GHCR_USER:  ${GHCR_USER:-wislanmoraes}
      GHCR_TOKEN: ${GHCR_TOKEN:-}
    volumes:
      # Achado numa revisão de segurança: o backend NUNCA lê/escreve nada
      # do diretório de deploy no código real (routers/updates.py) — ele só
      # inspeciona o PRÓPRIO container via socket e delega qualquer apply/
      # rollback pro sidecar `updater` via HTTP (http://updater:8080/...).
      # O antigo `.:/host_deploy:ro` montava o diretório INTEIRO — incluindo
      # o .env com DB_PASSWORD/SECRET_KEY/GHCR_TOKEN em texto puro — sem
      # necessidade nenhuma. Removido; só o socket continua preciso.
      - /var/run/docker.sock:/var/run/docker.sock  # necessário para WatchShell / terminal
    # PostgreSQL no próprio servidor: cadastre a instância com host
    # host.docker.internal. No Linux esse nome só existe com esta linha (o
    # Docker Desktop do Mac/Windows já o cria) e aponta para o IP fixo do Docker
    # no host (docker0, normalmente 172.17.0.1). O gateway da rede pgwho_internal
    # (172.18.0.1, 172.19.0.1...) muda se a rede for recriada; esse nome não.
    # No PostgreSQL: listen_addresses que inclua esse IP (ex.: '*', com o acesso
    # fechado pelo pg_hba e pelo firewall) e pg_hba liberando 172.16.0.0/12.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - pgwho_internal
    depends_on:
      timescaledb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1.5g
    # Backend nunca expõe porta para o host — acessível via nginx do frontend

  # ── Frontend (React + Nginx) ──────────────────────────────────────────────
  frontend:
    <<: *hardening
    image: ghcr.io/wislanmoraes/pgwho-frontend:${IMAGE_TAG:-latest}
    container_name: pgwho_frontend
    ports:
      - "${FRONTEND_PORT:-80}:80"   # única porta exposta ao mundo externo
    networks:
      - pgwho_internal
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512m

  # ── Updater (sidecar de atualização — sempre ativo) ──────────────────────
  updater:
    <<: *hardening
    image: ghcr.io/wislanmoraes/pgwho-updater:${IMAGE_TAG:-latest}
    container_name: pgwho_updater
    environment:
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY obrigatório}
      DEPLOY_DIR: /deploy
      # Caminho REAL no host (não o /deploy interno do container) — o `docker
      # compose` client-side resolve ${PWD} usando o cwd de QUEM RODA este
      # `up` (install.sh/update.sh no host), então isso captura corretamente
      # o diretório de deploy verdadeiro. Necessário pro update.sh conseguir
      # recriar o próprio updater via um container auxiliar (ver update.sh
      # para o comentário completo sobre por que isso importa).
      HOST_DEPLOY_DIR: ${PWD}
      GHCR_TOKEN: ${GHCR_TOKEN:-}
      GHCR_USER:  ${GHCR_USER:-wislanmoraes}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Achado numa revisão de segurança: o `.:/deploy:ro` antigo montava o
      # diretório inteiro (incluindo .env com os 3 segredos) só pra
      # update.sh precisar de 3 arquivos específicos. Trocado por bind mounts
      # individuais — reduz o que fica exposto dentro do container ao
      # estritamente necessário:
      #   .env                      → `docker compose` precisa dele no cwd
      #                                pra interpolar ${DB_PASSWORD} etc.
      #                                ao rodar `up`/`pull` dentro do sidecar.
      #   update.sh                 → é o script que o sidecar executa
      #                                (main.py roda `bash update.sh` com
      #                                cwd=/deploy). Fica :ro porque o
      #                                sidecar sempre roda com
      #                                SKIP_SELF_UPDATE=1 — nunca tenta se
      #                                sobrescrever nesse caminho.
      #   docker-compose.client.yml → PRECISA ser gravável (sem :ro): o
      #                                bloco de auto-atualização do compose
      #                                em update.sh roda incondicionalmente
      #                                (não respeita SKIP_SELF_UPDATE) e faz
      #                                `mv` sobre este arquivo sempre que a
      #                                versão no GitHub mudar — com :ro isso
      #                                falhava com "Read-only file system" e
      #                                abortava a atualização inteira antes
      #                                até de chegar no `docker compose pull`
      #                                (bug real, achado nesta revisão).
      - ./.env:/deploy/.env:ro
      - ./update.sh:/deploy/update.sh:ro
      - ./docker-compose.client.yml:/deploy/docker-compose.client.yml
    networks:
      - pgwho_internal
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256m
    # Porta 8080 nunca exposta ao host — acessível via /updater/ no Nginx

  # ── WatchShell (ferramenta interativa — opcional) ─────────────────────────
  watchshell:
    <<: *hardening
    image: ghcr.io/wislanmoraes/pgwho-watchshell:${IMAGE_TAG:-latest}
    container_name: pgwho_watchshell
    profiles:
      - tools   # só sobe com: docker compose --profile tools up -d
    networks:
      - pgwho_internal
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256m

# ── Rede interna ─────────────────────────────────────────────────────────────
networks:
  pgwho_internal:
    driver: bridge
    internal: false   # false = permite saída para internet (Anthropic API, etc.)
    # Para isolar completamente: mude para internal: true e use um proxy externo

# ── Volumes persistentes ──────────────────────────────────────────────────────
volumes:
  timescaledb_data:
    name: ${DATA_VOLUME_NAME:-pgwho_timescaledb_data}
