# ─────────────────────────────────────────────────────────────────────────────
#  pgwho — Template para implantação em parceiros
#
#  Uso:
#    1. Copie este arquivo para o servidor do parceiro
#    2. Crie um .env com as variáveis listadas abaixo
#    3. docker compose -f docker-compose.client.yml up -d
#
#  As imagens são públicas (#239): não há login no registry.
# ─────────────────────────────────────────────────────────────────────────────

name: pgwho

x-images: &registry ghcr.io/wislanmoraes

# Hardening comum reaproveitado por todo serviço abaixo (âncora YAML) —
# no-new-privileges bloqueia escalonamento via setuid/setcap mesmo que o
# processo dentro do container tente; log rotation evita que uma instalação
# "sobe e esquece" por meses encha o disco do parceiro com json-file sem limite.
x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:

  # ── Banco de dados (TimescaleDB) ──────────────────────────────────────────
  timescaledb:
    <<: *hardening
    # Pinada (era latest-pg18) — uma troca silenciosa de versão major/minor
    # do TimescaleDB num `docker compose pull` pode quebrar coisas que
    # dependem de versão exata (ex.: compressão nativa, Issue #55/#57).
    #
    # Achado ao vivo (cliente): a primeira tentativa de pin (2.27.2) já
    # nasceu quebrando quem tinha rodado :latest-pg18 antes desta linha
    # existir e avançado além dela (extensão registrada em 2.29.2 no
    # catálogo do banco) — CREATE EXTENSION IF NOT EXISTS nunca atualiza
    # uma extensão já instalada, e a imagem 2.27.2 não tem mais o .so de
    # releases mais novas. Resultado: backend trava no lifespan pra
    # SEMPRE (não é transitório) até a imagem ser trocada de volta pra uma
    # versão >= a já registrada. NUNCA reduza esta tag abaixo da mais alta
    # já publicada aqui — só suba. (main.py roda ALTER EXTENSION UPDATE no
    # boot, então subir a versão sempre migra os clientes pra frente
    # sozinho; descer nunca vai funcionar, e trava instalações existentes.)
    # TimescaleDB + pg_cron. A versão do TimescaleDB fica em db/Dockerfile
    # (TIMESCALE_TAG) e segue a regra acima: só sobe, nunca desce.
    image: ghcr.io/wislanmoraes/pgwho-db:${IMAGE_TAG:-latest}
    container_name: pgwho_db
    # Tempo para o checkpoint de desligamento quando o compose recria o banco
    # (imagem ou configuração nova). O padrão de 10 s mata o postgres no meio
    # do checkpoint (shared_buffers de GBs) e o próximo boot faz recuperação
    # de crash, relendo o WAL.
    stop_grace_period: 120s
    # Consulta paralela e índices usam /dev/shm; o padrão do Docker é 64 MB.
    shm_size: ${DB_SHM_SIZE:-512m}
    # Issue #57/#61: pg_stat_statements + auto_explain (limiar 1s, #322) no banco
    # INTERNO — telemetria do próprio backend, além da que já existe pras
    # instâncias monitoradas. Ver docker-compose.dev.yml (repo privado) pro
    # comentário completo sobre a escolha do limiar de 10ms.
    # logging_collector=on + jsonlog: ver docker-compose.dev.yml (repo
    # privado) pro comentário completo — log estruturado (Logs Brutos, aba
    # Banco) em vez de texto livre quebrado em várias linhas.
    command: [
      "postgres",
      "-c", "shared_preload_libraries=timescaledb,pg_stat_statements,auto_explain,pg_cron",
      # pg_cron (imagem db/Dockerfile): Gravador de Emergência no próprio banco
      # do pgwho. Background worker: o Gravador grava mesmo com as conexões
      # esgotadas. max_worker_processes acomoda o pg_cron ao lado dos workers
      # do TimescaleDB e das consultas paralelas.
      "-c", "cron.database_name=${DB_NAME:-pgwho}",
      "-c", "cron.use_background_workers=on",
      "-c", "max_worker_processes=32",
      # Recursos do banco (Issue #149). Na linha de comando, vencem o postgresql.conf
      # que o timescaledb-tune gerou uma única vez, na criação do banco. Sem paralelismo
      # nas conexões do pgwho (database.py); max_worker_processes acima não é tuning.
      "-c", "shared_buffers=${DB_SHARED_BUFFERS:-2GB}",
      "-c", "effective_cache_size=${DB_EFFECTIVE_CACHE_SIZE:-6GB}",
      "-c", "work_mem=${DB_WORK_MEM:-32MB}",
      "-c", "maintenance_work_mem=${DB_MAINTENANCE_WORK_MEM:-1GB}",
      "-c", "autovacuum_work_mem=${DB_AUTOVACUUM_WORK_MEM:-512MB}",
      "-c", "max_wal_size=${DB_MAX_WAL_SIZE:-4GB}",
      "-c", "min_wal_size=${DB_MIN_WAL_SIZE:-1GB}",
      "-c", "temp_file_limit=${DB_TEMP_FILE_LIMIT:-20GB}",
      "-c", "wal_compression=on",
      "-c", "checkpoint_timeout=15min",
      "-c", "track_io_timing=on",
      "-c", "log_lock_waits=on",
      "-c", "log_temp_files=2048",
      "-c", "pg_stat_statements.track=all",
      # Log (#322): plano só de consulta lenta, e sem os parâmetros (podem levar
      # texto das instâncias monitoradas para o log, fora da retenção).
      "-c", "auto_explain.log_min_duration=1s",
      "-c", "auto_explain.log_parameter_max_length=0",
      "-c", "auto_explain.log_analyze=off",
      "-c", "auto_explain.log_format=text",
      "-c", "logging_collector=on",
      "-c", "log_destination=jsonlog",
      # O backend apaga os mais antigos acima de PGWHO_DB_LOG_MAX_MB
      # (services/db_log_cleanup.py) e depende deste padrão de nome.
      "-c", "log_filename=postgresql-%Y-%m-%d_%H%M%S.log",
      "-c", "log_rotation_size=10MB",
      "-c", "log_rotation_age=1d",
      # Uma linha por execução do pg_cron no log; o histórico fica em
      # cron.job_run_details (o Gravador lê), que continua ligado.
      "-c", "cron.log_statement=off",
      # Sem contato externo com a Timescale.
      "-c", "timescaledb.telemetry_level=off"
    ]
    environment:
      POSTGRES_USER:     ${DB_USER:-pgwho}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD obrigatório}
      POSTGRES_DB:       ${DB_NAME:-pgwho}
    volumes:
      - timescaledb_data:/var/lib/postgresql
    networks:
      - pgwho_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-pgwho} -d ${DB_NAME:-pgwho}"]
      interval: 10s
      timeout: 5s
      retries: 5
      # Recuperação de crash (replay de até max_wal_size) ou boot lento: na janela
      # de start a falha não conta, e o primeiro sucesso encerra a espera. Sem
      # ela o banco virava unhealthy em ~50 s e o compose deixava o backend novo
      # criado mas parado (depends_on: service_healthy).
      start_period: 600s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "${DB_CPUS:-4.0}"
          memory: ${DB_MEMORY:-8g}
    # TimescaleDB nunca expõe porta para o host — acessível apenas internamente

  # ── Backend (FastAPI) ─────────────────────────────────────────────────────
  backend:
    <<: *hardening
    image: ghcr.io/wislanmoraes/pgwho-backend:${IMAGE_TAG:-latest}
    container_name: pgwho_backend
    user: root   # necessário para acessar /var/run/docker.sock (WatchShell)
    environment:
      DATABASE_URL:      postgresql+asyncpg://${DB_USER:-pgwho}:${DB_PASSWORD}@timescaledb:5432/${DB_NAME:-pgwho}
      DATABASE_URL_SYNC: postgresql://${DB_USER:-pgwho}:${DB_PASSWORD}@timescaledb:5432/${DB_NAME:-pgwho}
      SECRET_KEY:        ${SECRET_KEY:?SECRET_KEY obrigatório}
      # Senha inicial do admin (#264): gerada pelo install.sh, usada só no
      # primeiro boot; a troca é exigida no primeiro login.
      PGWHO_ADMIN_PASSWORD: ${PGWHO_ADMIN_PASSWORD:-}
      # Cifra dos segredos do banco interno (Issue #228): gerada pelo install.sh/update.sh.
      PGWHO_ENCRYPTION_KEY: ${PGWHO_ENCRYPTION_KEY:-}
      # Licença v2 (#234): identidade da instalação, gerada pelo install.sh/update.sh.
      PGWHO_INSTALLATION_ID: ${PGWHO_INSTALLATION_ID:-}
      PGWHO_LICENSE_SERVER: ${PGWHO_LICENSE_SERVER:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      COLLECTOR_INTERVAL_SECONDS:        ${COLLECTOR_INTERVAL_SECONDS:-60}
      ACTIVITY_SAMPLE_INTERVAL_SECONDS:  ${ACTIVITY_SAMPLE_INTERVAL_SECONDS:-5}
      ALERT_EVALUATION_INTERVAL_SECONDS: ${ALERT_EVALUATION_INTERVAL_SECONDS:-60}
      WATCHSHELL_IMAGE: ghcr.io/wislanmoraes/pgwho-watchshell:${IMAGE_TAG:-latest}
      GHCR_USER:  ${GHCR_USER:-wislanmoraes}
      # Log do sistema operacional (syslog do servidor) no System Health. Desligado
      # por padrão: traz mensagens de todos os serviços da máquina, não só do pgwho.
      PGWHO_HOST_LOGS: ${PGWHO_HOST_LOGS:-false}
      # Teto, em MB, do log do banco interno (mínimo 50).
      PGWHO_DB_LOG_MAX_MB: ${PGWHO_DB_LOG_MAX_MB:-200}
      # Base dos links "Abrir no pgwho" das notificações quando o canal não
      # guardou endereço (o install.sh grava https://<domínio> com HTTPS).
      PGWHO_PUBLIC_URL: ${PGWHO_PUBLIC_URL:-}
    volumes:
      # Achado numa revisão de segurança: o backend NUNCA lê/escreve nada
      # do diretório de deploy no código real (routers/updates.py) — ele só
      # inspeciona o PRÓPRIO container via socket e delega qualquer apply/
      # rollback pro sidecar `updater` via HTTP (http://updater:8080/...).
      # O antigo `.:/host_deploy:ro` montava o diretório INTEIRO — incluindo
      # o .env com DB_PASSWORD/SECRET_KEY em texto puro — sem
      # necessidade nenhuma. Removido; só o socket continua preciso.
      - /var/run/docker.sock:/var/run/docker.sock  # necessário para WatchShell / terminal
      # System Health (Issue #158): CPU, memória, discos, I/O, rede e processos
      # do SERVIDOR, não do container — mesmo arranjo do node_exporter. Somente
      # leitura; o backend nunca escreve nesses caminhos. Sem eles a seção
      # Servidor avisa que não tem leitura.
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      # rslave: montagens e desmontagens feitas no servidor depois que o backend
      # subiu chegam aqui. Sem isso o container guarda uma cópia de cada disco
      # montado no boot, e um `umount` no servidor (troca de disco, fsck,
      # desanexar volume de nuvem) deixa o dispositivo ocupado até reiniciar o
      # backend. Exige a raiz do servidor como montagem compartilhada, o padrão
      # com systemd; sem systemd: `mount --make-rshared /` antes de subir.
      # Docker Desktop (Windows/WSL, macOS): a raiz da VM do Docker não é
      # compartilhada e o rslave é recusado; o update.sh grava
      # PGWHO_HOST_ROOT_MOUNT_OPTS=ro no .env (Issue #248). Não edite aqui.
      - /:/host/root:${PGWHO_HOST_ROOT_MOUNT_OPTS:-ro,rslave}
    # PostgreSQL no próprio servidor: cadastre a instância com host
    # host.docker.internal. No Linux esse nome só existe com esta linha (o
    # Docker Desktop do Mac/Windows já o cria) e aponta para o IP fixo do Docker
    # no host (docker0, normalmente 172.17.0.1). O gateway da rede pgwho_internal
    # (172.18.0.1, 172.19.0.1...) muda se a rede for recriada; esse nome não.
    # No PostgreSQL: listen_addresses que inclua esse IP (ex.: '*', com o acesso
    # fechado pelo pg_hba e pelo firewall) e pg_hba liberando 172.16.0.0/12.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - pgwho_internal
    depends_on:
      timescaledb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "${BACKEND_CPUS:-2.0}"
          memory: ${BACKEND_MEMORY:-2g}
    # Backend nunca expõe porta para o host — acessível via nginx do frontend

  # ── Frontend (React + Nginx) ──────────────────────────────────────────────
  frontend:
    <<: *hardening
    image: ghcr.io/wislanmoraes/pgwho-frontend:${IMAGE_TAG:-latest}
    container_name: pgwho_frontend
    ports:
      # Sem HTTPS, a única porta exposta. Com HTTPS (serviço `https` abaixo), o
      # install.sh grava FRONTEND_BIND=127.0.0.1: e o painel em HTTP só responde
      # no próprio servidor; quem vem de fora entra pelo Caddy.
      - "${FRONTEND_BIND:-}${FRONTEND_PORT:-80}:80"
    networks:
      - pgwho_internal
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512m

  # ── Updater (sidecar de atualização — sempre ativo) ──────────────────────
  updater:
    <<: *hardening
    image: ghcr.io/wislanmoraes/pgwho-updater:${IMAGE_TAG:-latest}
    container_name: pgwho_updater
    environment:
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY obrigatório}
      DEPLOY_DIR: /deploy
      # Caminho REAL no host (não o /deploy interno do container) — o `docker
      # compose` client-side resolve ${PWD} usando o cwd de QUEM RODA este
      # `up` (install.sh/update.sh no host), então isso captura corretamente
      # o diretório de deploy verdadeiro. Necessário pro update.sh conseguir
      # recriar o próprio updater via um container auxiliar (ver update.sh
      # para o comentário completo sobre por que isso importa).
      HOST_DEPLOY_DIR: ${PWD}
      GHCR_USER:  ${GHCR_USER:-wislanmoraes}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Achado numa revisão de segurança: o `.:/deploy:ro` antigo montava o
      # diretório inteiro (incluindo .env com os 3 segredos) só pra
      # update.sh precisar de 3 arquivos específicos. Trocado por bind mounts
      # individuais — reduz o que fica exposto dentro do container ao
      # estritamente necessário:
      #   .env                      → `docker compose` precisa dele no cwd
      #                                pra interpolar ${DB_PASSWORD} etc.
      #                                ao rodar `up`/`pull` dentro do sidecar.
      #   update.sh                 → é o script que o sidecar executa
      #                                (main.py roda `bash update.sh` com
      #                                cwd=/deploy). Fica :ro porque o
      #                                sidecar sempre roda com
      #                                SKIP_SELF_UPDATE=1 — nunca tenta se
      #                                sobrescrever nesse caminho.
      #   docker-compose.client.yml → PRECISA ser gravável (sem :ro): o
      #                                bloco de auto-atualização do compose
      #                                em update.sh roda incondicionalmente
      #                                (não respeita SKIP_SELF_UPDATE) e faz
      #                                `mv` sobre este arquivo sempre que a
      #                                versão no GitHub mudar — com :ro isso
      #                                falhava com "Read-only file system" e
      #                                abortava a atualização inteira antes
      #                                até de chegar no `docker compose pull`
      #                                (bug real, achado nesta revisão).
      - ./.env:/deploy/.env:ro
      - ./update.sh:/deploy/update.sh:ro
      - ./docker-compose.client.yml:/deploy/docker-compose.client.yml
    networks:
      - pgwho_internal
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256m
    # Porta 8080 nunca exposta ao host — acessível via /updater/ no Nginx

  # ── HTTPS (opcional, #269) ────────────────────────────────────────────────
  # Só sobe com COMPOSE_PROFILES=https no .env (o install.sh grava quando se
  # informa um domínio). O Caddy emite e renova o certificado (Let's Encrypt)
  # para PGWHO_DOMAIN: o domínio precisa apontar para este servidor e as portas
  # 80 e 443 precisam estar livres e abertas para a internet.
  https:
    <<: *hardening
    image: caddy:2.10.0-alpine
    container_name: pgwho_https
    profiles:
      - https
    command: ["caddy", "reverse-proxy", "--from", "${PGWHO_DOMAIN:-}", "--to", "frontend:80", "--internal-certs=${PGWHO_TLS_INTERNAL:-false}"]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data      # certificados: perder obriga a emitir de novo
      - caddy_config:/config
    networks:
      - pgwho_internal
    depends_on:
      - frontend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128m

  # ── WatchShell (ferramenta interativa — opcional) ─────────────────────────
  watchshell:
    <<: *hardening
    image: ghcr.io/wislanmoraes/pgwho-watchshell:${IMAGE_TAG:-latest}
    container_name: pgwho_watchshell
    profiles:
      - tools   # só sobe com: docker compose --profile tools up -d
    networks:
      - pgwho_internal
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256m

# ── Rede interna ─────────────────────────────────────────────────────────────
networks:
  pgwho_internal:
    driver: bridge
    internal: false   # false = permite saída para internet (Anthropic API, etc.)
    # Para isolar completamente: mude para internal: true e use um proxy externo

# ── Volumes persistentes ──────────────────────────────────────────────────────
volumes:
  timescaledb_data:
    name: ${DATA_VOLUME_NAME:-pgwho_timescaledb_data}
  caddy_data:
    name: pgwho_caddy_data
  caddy_config:
    name: pgwho_caddy_config
